name: Manual Full Rescan

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan mode'
        required: true
        default: daily
        type: choice
        options:
          - daily
          - rub

permissions:
  contents: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run rate monitor
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          python monitor.py --mode "$SCAN_MODE"

      - name: Generate public API
        run: python publish_api.py

      - name: Generate Pages
        run: python generate_pages.py

      - name: Publish generated API and Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api index.html site || true
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
          else
            git commit -m "chore: publish manual rate rescan"
            git push
          fi
