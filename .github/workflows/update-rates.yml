name: Update Tajik bank rates

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Manual scan mode (always full daily scan)'
        required: false
        default: daily
        type: choice
        options:
          - daily
      telegram_test:
        description: 'Send a Telegram test snapshot'
        required: false
        default: false
        type: boolean
  schedule:
    # Full scan every 30 minutes, 08:13..19:43 Asia/Dushanbe = 03:13..14:43 UTC.
    - cron: '13,43 3-14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Every run is full/daily so RUB, NBT, USD and EUR stay synchronized.
  SCAN_MODE: daily

concurrency:
  group: tajik-rate-monitor-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Restore last valid NBT snapshot
        uses: actions/cache/restore@v5
        with:
          path: site/nbt_last_valid.json
          key: nbt-last-valid-${{ github.run_id }}
          restore-keys: nbt-last-valid-
      - name: Collect official bank rates
        run: python monitor.py
      - name: Collect NBT reference and commercial-bank rates
        run: python reference_rates.py
      - name: Collect Alif API fallback base
        run: python alif_fallback.py
      - name: Normalize cash and transfer rates
        run: python postprocess.py
      - name: Calculate deterministic rates and validate inputs
        run: python calculate_rates.py
      - name: Save latest valid NBT snapshot
        uses: actions/cache/save@v5
        with:
          path: site/nbt_last_valid.json
          key: nbt-last-valid-${{ github.run_id }}
      - name: Send Telegram anomaly warning
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_warning.py
      - name: Generate public JSON API
        run: python publish_api.py
      - name: Sync validated final data to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RATE_SCAN_MODE: daily
        run: python sync_supabase.py
      - name: Check for anomalies
        id: anomaly_check
        run: echo "count=$(python -c 'import json; print(len(json.load(open("site/anomalies.json", encoding="utf-8"))["anomalies"]))' )" >> "$GITHUB_OUTPUT"
      - name: Notify Telegram on monitored rate changes
        if: steps.anomaly_check.outputs.count == '0' || inputs.telegram_test == true
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
        run: python telegram_notify.py
      - name: Upload collector snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collector-output
          path: |
            site/results.json
            site/history.json
            site/calculated_rates.json
            site/anomalies.json
            site/nbt_last_valid.json
            site/api/*.json
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
