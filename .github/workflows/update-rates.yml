name: Update Tajik bank rates

on:
  push:
    branches: [main]
  schedule:
    # Every 10 minutes, offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tajik-rate-monitor-pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect official bank rates
        run: python monitor.py

      - name: Normalize cash and transfer rates
        run: python postprocess.py

      - name: Upload collector snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collector-output
          path: |
            site/results.json
            site/history.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
