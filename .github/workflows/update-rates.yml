name: Update Tajik bank rates

on:
  push:
    branches: [main]
  schedule:
    # Native Dushanbe time. One simple cron entry reduces scheduler ambiguity.
    # Mon-Fri every 30 minutes from 08:23 through 17:53 local time.
    # Odd minutes avoid GitHub's documented start-of-hour high-load period.
    - cron: '23,53 8-17 * * 1-5'
      timezone: 'Asia/Dushanbe'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send a Telegram test snapshot'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tajik-rate-monitor-pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect official bank rates
        run: python monitor.py

      - name: Normalize cash and transfer rates
        run: python postprocess.py

      - name: Collect Oriyon USD EUR card buy rates
        run: python oriyon_card.py

      # Runs before Pages is redeployed, so live results.json is still the previous snapshot.
      # Run change detection for every collector execution so a push cannot silently
      # deploy a changed rate and consume the notification baseline.
      - name: Notify Telegram on monitored rate changes
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
        run: python telegram_notify.py

      - name: Upload collector snapshot
        uses: actions/upload-artifact@v4
        with:
          name: collector-output
          path: |
            site/results.json
            site/history.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
